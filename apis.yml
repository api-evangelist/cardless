aid: cardless
name: Cardless
description: 'Cardless, Inc. is a San Francisco fintech that operates an embedded co-branded
  credit card platform, letting consumer brands launch and run their own credit card
  programs natively inside their own apps and websites. The platform pairs a partner
  API surface with pre-built components covering the full credit journey — application
  and identity verification, real-time decisioning, checkout with instant virtual cards,
  card management and transaction disputes — while Cardless handles issuing-bank relationships,
  card production, underwriting, fraud, KYC/AML compliance, servicing and support behind
  the scenes. It is network-agnostic across Visa, Mastercard and American Express. Named
  partners include Coinbase (Coinbase One Card), Bilt, Qatar Airways Privilege Club,
  Alibaba.com, LATAM Airlines, Avianca LifeMiles, TAP Air Portugal and Avelo Airlines.
  Developer documentation at docs.cardless.com is gated behind a partner login, so no
  public OpenAPI, SDKs or sandbox credentials are published.'
