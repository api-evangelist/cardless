apis:
- aid: cardless:partner-api
  name: Cardless Partner API
  description: 'The Cardless partner API surface used by brands to embed a co-branded
    credit card program: partner authentication (Basic-auth exchange of a partner-signed
    JWT for a bearer access token), application submission and decisioning, account
    servicing, payments, transactions and disputes. Documentation and the OpenAPI
    fragments that back it are gated behind a partner login at docs.cardless.com;
    the production API host answers unauthenticated requests with HTTP 401.'
  humanURL: https://docs.cardless.com/
  baseURL: https://api.cardless.com/
  tags:
  - Credit Cards
  - Card Issuing
  - Embedded Finance
  - Payments
  properties:
  - type: Documentation
    url: https://docs.cardless.com/
  - type: Authentication
    url: authentication/cardless-authentication.yml
  - type: Conventions
    url: conventions/cardless-conventions.yml
- aid: cardless:docs-mcp
  name: Cardless Docs MCP Server
  description: 'A remote Model Context Protocol server published by Cardless at docs.cardless.com/mcp
    (Mintlify-hosted). It answers tools/list anonymously and exposes three read-oriented
    tools over the Cardless documentation corpus — documentation search, a read-only
    virtualized documentation filesystem, and docs feedback submission. It also advertises
    OAuth 2.0 authorization-server and protected-resource metadata with a single mcp:search
    scope. This is a documentation-search MCP server, not an MCP projection of the
    Cardless partner API.'
  humanURL: https://docs.cardless.com/
  baseURL: https://docs.cardless.com/mcp
  tags:
  - MCP
  - Documentation
  - Agents
  properties:
  - type: MCPServer
    url: mcp/cardless-mcp.yml
  - type: OAuthScopes
    url: scopes/cardless-scopes.yml
