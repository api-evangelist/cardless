x-observation:
  summary: Documentation corpus is partner-login-gated in the browser but readable anonymously through
    this MCP endpoint.
  detail: Every HTML path on docs.cardless.com redirects to /login?redirect=... , and docs.cardless.com/sitemap.xml
    is empty — the documentation is deliberately gated to partners. The MCP endpoint at docs.cardless.com/mcp
    nonetheless answers tools/list and tools/call with no credentials, and its query_docs_filesystem tool
    exposes the gated corpus, including OpenAPI fragments under /openapi/api-reference/ (applications/schema.yaml,
    authentication/get-token.yaml) and /openapi/not used/payment-plans/. API Evangelist recorded the existence
    and shape of that contract as catalog metadata but deliberately did NOT copy the gated specification
    or documentation bodies into this public repo. Reported here as a finding for Cardless, not republished.
  observed: '2026-08-01'
